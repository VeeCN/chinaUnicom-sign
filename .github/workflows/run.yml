name: China Unicom Scheduled Run
on:
  schedule:
    - cron: '0 2 * * *'→ Runs at 02:00

  workflow_dispatch:
permissions:
  contents: read
jobs:
  run-script:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        run: npm install
      - name: Run script
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          chinaUnicomCookie: ${{ secrets.CHINAUNICOMCOOKIE }}
        shell: bash
        run: |
          if [ -z "$chinaUnicomCookie" ]; then
            echo "::error::Please configure the CHINAUNICOMCOOKIE repository secret."
            exit 1
          fi
          npm start

