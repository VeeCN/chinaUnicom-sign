name: China Unicom Scheduled Run

on:
  schedule:
  - cron: "0 2 * * *" # 10:00 China Standard Time (UTC+8)
  workflow_dispatch:


jobs:
  run-script:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: 注入私有Secrets到环境
      uses: zhlhlf/Secrets_To_Env@master
      with:
        secrets_json: ${{ toJSON(secrets) }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install dependencies
      run: npm install

    - name: Run script
      shell: bash
      run: |
        set -a
        [ -f .env ] && source .env
        set +a
        npm start
