name: China Unicom Scheduled Run
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install requests pycryptodome
      - name: Run script
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          chinaUnicomCookie: ${{ secrets.CHINAUNICOMCOOKIE }}
        shell: bash
        run: |
          if [ -z "$chinaUnicomCookie" ]; then
            echo "::error::Please configure the CHINAUNICOMCOOKIE repository secret."
            exit 1
          fi
          python -u chinaUnicom.py
