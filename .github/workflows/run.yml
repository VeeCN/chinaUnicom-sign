name: China Unicom Scheduled Run

on:
  schedule:
  - cron: "0 2 * * *" # 10:00 China Standard Time (UTC+8)
  workflow_dispatch:


jobs:
  run-script:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      CHINAUNICOMCOOKIE: ${{ secrets.CHINAUNICOMCOOKIE }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install dependencies
      run: npm install

    - name: Run script
      run: npm start
